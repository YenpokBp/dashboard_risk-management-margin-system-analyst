<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EWF Risk - Kalkulator Kondisi Dana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',card:'var(--card)',line:'var(--line)',tx:'var(--text)',mu:'var(--muted)',g:'var(--g)',o:'var(--o)',ot:'var(--ot)',soft:'var(--soft)'}}}}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="sticky z-20 px-4 lg:px-8 py-3 flex items-center gap-3" style="background:var(--g);top:env(safe-area-inset-top,0px)">
  <div class="w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg flex-shrink-0" style="background:var(--o);color:#1b1000">E</div>
  <div class="mr-auto min-w-0"><div class="text-white font-semibold leading-tight truncate">EWF Risk</div><div class="text-xs truncate" style="color:#b9d4c4">Kalkulator kondisi dana</div></div>
  <button id="theme" class="btn">Tema</button>
</header>

<main class="max-w-6xl mx-auto p-4 lg:p-8 grid lg:grid-cols-12 gap-4 items-start">
  <section class="card p-4 lg:col-span-5 lg:sticky lg:top-20">
    <div class="flex items-center gap-3 mb-4"><span class="num">1</span><h2 class="font-semibold">Input harga</h2></div>
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2"><label for="inst">Instrumen</label>
        <select id="inst" class="inp"><option value="gold">Gold XULF</option><option value="nikkei">Nikkei</option><option value="hangseng">Hang Seng</option></select></div>
      <div class="col-span-2"><label>Posisi</label>
        <div class="seg" role="group" aria-label="Posisi"><button type="button" data-side="buy" class="on" aria-pressed="true">Buy</button><button type="button" data-side="sell" aria-pressed="false">Sell</button></div></div>
      <div><label for="eq">Modal / dana awal (USD)</label><input id="eq" class="inp" inputmode="decimal" value="49545.05"></div>
      <div><label for="lot">Lot</label><input id="lot" class="inp" inputmode="decimal" value="1"></div>
      <div><label for="entry">Price entry</label><input id="entry" class="inp" inputmode="decimal" value="4137.45"></div>
      <div><label for="cur">Current price</label><input id="cur" class="inp" inputmode="decimal" value="4134.91"></div>
    </div>
    <details class="mt-3">
      <summary class="text-sm cursor-pointer text-mu">Parameter kontrak</summary>
      <div class="grid grid-cols-2 gap-3 mt-3">
        <div><label for="pv">Nilai per poin per lot (USD)</label><input id="pv" class="inp" inputmode="decimal"></div>
        <div><label for="jm">Jaminan per lot (USD)</label><input id="jm" class="inp" inputmode="decimal"></div>
      </div>
    </details>
  </section>

  <section class="card p-4 lg:col-span-7">
    <div class="flex items-center gap-3 mb-2"><span class="num">2</span><h2 class="font-semibold">Kondisi dana</h2></div>
    <div id="res"></div>
  </section>


</main>

<script src="js/app.js"></script>
</body>
</html>
